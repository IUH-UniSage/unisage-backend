spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}
server.servlet.context-path=/api/v1
# SUPER_ADMIN tokens carry a department_access entry per department; with the full
# org tree seeded the gateway-forwarded Authorization + X-User-* headers exceed
# Tomcat's 8 KB default and every request fails with a bare 400. Raise to 64 KB.
server.max-http-header-size=65536
# Hard ceiling for any upload. The admin setting ingest.max_file_size_mb is the real limit and
# can be raised up to this value (SystemConfigServiceImpl rejects anything higher).
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
spring.servlet.multipart.enabled=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=audit fields user relation

# Same Redis instance as unisage-agent (model registry pub/sub signal only — DB is
# the source of truth). Redis down must never fail startup or block a transaction.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
management.health.redis.enabled=true

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER}}
minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
minio.bucket=${MINIO_BUCKET:unisage-documents}
minio.region=${MINIO_REGION:us-east-1}
minio.presigned-url-expiry-seconds=${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:3600}

DEFAULT_SUPERADMIN_PASS=${DEFAULT_SUPERADMIN_PASS}
DEFAULT_INGESTADMIN_PASS=${DEFAULT_INGESTADMIN_PASS}
DEFAULT_USER_PASS=${DEFAULT_USER_PASS}

jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
jwt.secret=${JWT_SECRET}

app.encryption.key=${APP_ENCRYPTION_KEY}

spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.size-parameter=limit
spring.data.web.pageable.page-parameter=page

# Zone used only to present reset times; counters and windows are stored in UTC.
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}

app.guest-session.cleanup.cron=${GUEST_SESSION_CLEANUP_CRON:0 0 3 * * *}
app.conversation.retention.cron=${CONVERSATION_RETENTION_CRON:0 30 3 * * *}

# Shared secret unisage-agent (Python) sends as X-Internal-Secret on direct
# server-to-server calls into this backend (bypassing the gateway). Default
# matches api-gateway's AddRequestHeader and unisage-agent's own default so
# local dev works out of the box without env overrides.
app.internal.secret-key=${INTERNAL_SECRET_KEY:unisage-internal-secret-key-2026}

# Fail-closed CIDR allowlist for /internal/** — empty rejects every call. Set explicitly in .env.
app.internal.allowed-cidrs=${INTERNAL_ALLOWED_CIDRS:}
# Staging-only: logs remoteAddr for /internal/** to help pick the real CIDR value (no header/body).
app.internal.log-remote-addr=${INTERNAL_LOG_REMOTE_ADDR:false}

# SSRF guard: hostnames allowed to resolve to a private/blocked IP range (self-hosted providers
# only). Empty in production = no self-hosted internal target permitted.
app.model-registry.url-allowlist=${MODEL_REGISTRY_URL_ALLOWLIST:}

# Budget alert Slack channel - webhook URL never leaves this process (not returned by any API,
# not stored in budget_alert_settings, never logged). "Configured" = enabled AND a non-blank
# webhook URL - SlackWebhookClient checks both before ever building a request.
app.budget-alert.slack.enabled=${BUDGET_ALERT_SLACK_ENABLED:false}
app.budget-alert.slack.webhook-url=${BUDGET_ALERT_SLACK_WEBHOOK_URL:}
app.budget-alert.slack.channel-label=${BUDGET_ALERT_SLACK_CHANNEL_LABEL:}
app.budget-alert.slack.timeout-ms=${BUDGET_ALERT_SLACK_TIMEOUT_MS:3000}

# Budget alert email - "configured" = a non-blank spring.mail.host AND a non-blank from address;
# BudgetAlertDispatchServiceImpl checks both (via StringUtils.hasText) before ever asking its
# ObjectProvider<JavaMailSender> for a sender, so a blank/misconfigured SMTP setup degrades to
# SKIPPED instead of failing every send attempt.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.budget-alert.mail.from=${BUDGET_ALERT_MAIL_FROM:}
# A blank/unreachable SMTP host must never turn the public health check DOWN - budget email is a
# soft-limit feature, not a service the rest of the system depends on being reachable.
management.health.mail.enabled=false

# Link a budget alert's message points at - the Cost Management page in unisage-web. Blank =
# alert messages omit the link (no route to point at yet).
app.frontend-url=${FRONTEND_URL:}

# Budget alert detection: threshold check every 2 minutes, spike check once a day just after
# midnight in app.timezone. Dispatch (the actual send) runs on the same cadence as the
# threshold check - retries use next_attempt_at's own backoff, not a separate schedule.
app.budget-alert.check-cron=${BUDGET_ALERT_CHECK_CRON:0 */2 * * * *}
app.budget-alert.spike-cron=${BUDGET_ALERT_SPIKE_CRON:0 5 0 * * *}

# Model prices: synced daily (app.timezone) from LiteLLM's public price map; SA overrides win.
app.model-pricing.source-url=${MODEL_PRICING_SOURCE_URL:https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
app.model-pricing.sync-cron=${MODEL_PRICING_SYNC_CRON:0 0 3 * * *}
app.model-pricing.timeout-ms=${MODEL_PRICING_SYNC_TIMEOUT_MS:15000}

# Second layer on top of the CIDR filter: never rewrite getRemoteAddr() from a forwarded header.
server.forward-headers-strategy=NONE

# UNISAGE-62: system health-check. Actuator itself is not exposed as a public web endpoint -
# this app's own /admin/health controller (behind normal permission-based auth) is the intended
# access point, so lock every raw actuator/** path down.
management.endpoints.web.exposure.include=
management.endpoint.health.enabled=true
# Keep the components map limited to the 4 dependencies this ticket cares about (db/gateway/
# agent/minio) - the generic diskSpace/ping indicators Actuator auto-configures add noise.
management.health.diskspace.enabled=false
management.health.ping.enabled=false
management.health.ssl.enabled=false
# Actuator's default StatusAggregator only knows UP/DOWN/OUT_OF_SERVICE/UNKNOWN; register
# DEGRADED (severity between UP and DOWN/OUT_OF_SERVICE) so a HealthIndicator can report it and
# have it correctly influence the aggregate overall status.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN

# Gateway/agent base URLs used by GatewayHealthIndicator / AgentHealthIndicator. 8889 is
# unisage-gateway's application.yml fallback, but every dev .env in this project overrides
# SERVER_PORT=8400 - default to the port that's actually running, not the unused YAML fallback,
# or this check always reports the gateway DOWN even when it's healthy.
app.health-check.gateway-url=${HEALTH_CHECK_GATEWAY_URL:http://localhost:8400}
app.health-check.agent-url=${HEALTH_CHECK_AGENT_URL:http://localhost:8402}
app.health-check.timeout-ms=${HEALTH_CHECK_TIMEOUT_MS:2500}
# How often SystemHealthCheckJob runs the same check and persists one SystemHealthCheck row, so
# past downtime is queryable via GET /admin/health/history (default: every 5 minutes).
app.health-check.history.cron=${HEALTH_CHECK_HISTORY_CRON:0 */5 * * * *}
