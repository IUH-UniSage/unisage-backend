spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}
server.servlet.context-path=/api/v1
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER}}
minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
minio.bucket=${MINIO_BUCKET:unisage-documents}
minio.region=${MINIO_REGION:us-east-1}
minio.presigned-url-expiry-seconds=${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:3600}

DEFAULT_SUPERADMIN_PASS=${DEFAULT_SUPERADMIN_PASS}
DEFAULT_INGESTADMIN_PASS=${DEFAULT_INGESTADMIN_PASS}
DEFAULT_USER_PASS=${DEFAULT_USER_PASS}

jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
jwt.secret=${JWT_SECRET}

app.encryption.key=${APP_ENCRYPTION_KEY}

spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.size-parameter=limit
spring.data.web.pageable.page-parameter=page

app.usage-limit.enabled=${USAGE_LIMIT_ENABLED:false}
app.usage-limit.user-daily-limit=${USER_DAILY_MESSAGE_LIMIT:30}
app.usage-limit.guest-daily-limit=${GUEST_DAILY_MESSAGE_LIMIT:10}
app.usage-limit.limit-type=${USAGE_LIMIT_TYPE:MESSAGE}
app.usage-limit.scope=${USAGE_LIMIT_SCOPE:DAILY}
