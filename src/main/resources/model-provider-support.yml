# Which UniSage chat-model providers can call a priced model - read by ModelProviderSupportCatalog
# and returned with every row of GET /model-pricing. Committed, generated by
# scripts/model-provider-support/generate.py plus hand-probed entries; the price sync never writes it (deprecation dates come from LiteLLM into model_prices.deprecation_date instead).
#
# providers: provider-level default, for models without an entry under `models` (status "inferred",
#   or "unsupported" when the provider is not listed). Key = model_prices.provider (LiteLLM's
#   litellm_provider, "gemini" stored as "google"); value = chat-model providers that can call it.
#   "openai" on a non-openai provider means: pick OpenAI with that provider's API Base URL.
#   Only providers documented as OpenAI-compatible are listed. Gemini/Z.ai have no "callable via
#   google/zai" lists: only Google serves the Gemini format (Vertex needs project auth that
#   build_model() doesn't pass) and ZaiModel sends Z.ai-only params (extra_body.thinking).
#
# models: one entry per model the price sync stores (every per-token-priced LiteLLM model).
#   Regenerate with scripts/model-provider-support/generate.py when LiteLLM adds models; it keeps
#   entries carrying `probed_at` and re-derives the rest. Key = "<provider>/<model>", lowercase.
#   status: tested      - called successfully through unisage-agent's build_model() (probed_at)
#           paid        - blocked only by billing during the probe (free-tier Gemini key, empty
#                         Z.ai balance), assumed callable on a paid plan (probed_at)
#           restricted  - the provider must grant access first (probed_at)
#           inferred    - not probed; providers come from the `providers:` default above
#           unsupported - not callable by UniSage on any plan; `note` says why
#   is_deprecated: true when the provider API itself reported the model as retired during a probe,
#     even if LiteLLM has no deprecation_date for it.
#   probed_at: day of the probe (2026-10-05: one short prompt per model and route; the
#     OpenAI-compatible route answered exactly like the native one). To probe new models, call
#     them through build_model(), then set status/providers/note and probed_at by hand.

providers:
  openai: [openai]
  google: [google, openai]
  zai: [zai, openai]
  aihubmix: [openai]
  baseten: [openai]
  cerebras: [openai]
  dashscope: [openai]
  deepinfra: [openai]
  deepseek: [openai]
  fireworks_ai: [openai]
  friendliai: [openai]
  gmi: [openai]
  groq: [openai]
  hyperbolic: [openai]
  lambda_ai: [openai]
  lemonade: [openai]
  minimax: [openai]
  mistral: [openai]
  moonshot: [openai]
  nebius: [openai]
  novita: [openai]
  nscale: [openai]
  nvidia_nim: [openai]
  ollama: [openai]
