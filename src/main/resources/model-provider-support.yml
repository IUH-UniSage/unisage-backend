# Which UniSage chat-model providers can call a priced model - read by ModelProviderSupportCatalog
# and returned with every row of GET /model-pricing. Edited by hand and committed; the price sync
# never writes it (deprecation dates come from LiteLLM into model_prices.deprecation_date instead).
#
# providers: provider-level default, for models without an entry under `models` (status "inferred",
#   or "unsupported" when the provider is not listed). Key = model_prices.provider (LiteLLM's
#   litellm_provider, "gemini" stored as "google"); value = chat-model providers that can call it.
#   "openai" on a non-openai provider means: pick OpenAI with that provider's API Base URL.
#   Only providers documented as OpenAI-compatible are listed. Gemini/Z.ai have no "callable via
#   google/zai" lists: only Google serves the Gemini format (Vertex needs project auth that
#   build_model() doesn't pass) and ZaiModel sends Z.ai-only params (extra_body.thinking).
#
# models: probed on 2026-10-05 through unisage-agent's build_model() (one short prompt per model
#   and route; the OpenAI-compatible route answered exactly like the native one). Key = "<provider>/<model>".
#   status: tested      - called successfully
#           paid        - blocked only by billing during the probe (free-tier Gemini key, empty
#                         Z.ai balance), assumed callable on a paid plan
#           restricted  - the provider must grant access first
#           unsupported - not callable by UniSage on any plan; `note` says why
#   is_deprecated: true when the provider API itself reported the model as retired, even if
#     LiteLLM has no deprecation_date for it.
#   Re-probe and update when new models land in the price map.

providers:
  openai: [openai]
  google: [google, openai]
  zai: [zai, openai]
