# Môi trường đánh giá RAG (eval): DB, bucket và Redis riêng, không đụng dữ liệu dev.
# Bật bằng APP_PROFILE=eval trong .ENV (hoặc ./mvnw spring-boot:run -Dspring-boot.run.profiles=eval).
# Chỉ ghi những gì khác application.properties; host/port/mật khẩu vẫn lấy từ .ENV.
# Quy ước tên: changes/30-09-2026-RAG-Evaluation/spec.md §12.7 (khớp .env.eval.example của unisage-agent).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME_EVAL:assistant_eval}
minio.bucket=${MINIO_BUCKET_EVAL:unisage-eval}
spring.data.redis.url=${REDIS_URL_EVAL:redis://localhost:6379/3}
# Qdrant collection whose embedding identity the model-registry snapshot carries: must equal the
# agent's QDRANT_COLLECTION for this env, otherwise the agent's identity guard refuses to embed.
model-registry.embedding-collection-name=${QDRANT_COLLECTION_EVAL:unisage_eval_chunks}
