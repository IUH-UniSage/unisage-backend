services:
  unisage-db:
    image: pgvector/pgvector:pg17
    container_name: unisage-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: assistant_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    # UNISAGE-102: WAL summaries for Differential backups and WAL archiving for the Transaction
    # log backups (ADR-0008). The entrypoint keeps the container up across a Postgres stop so the
    # backend can restore a backup through the shared /restore folder (ADR-0010).
    entrypoint: ["sh", "/usr/local/bin/unisage-entrypoint.sh"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - summarize_wal=on
      # A Differential needs the summaries back to its Full; the 10-day default is shorter than
      # a monthly or yearly Full cycle.
      - -c
      - wal_summary_keep_time=400d
      - -c
      - archive_mode=on
      # Copy to .tmp then rename, so the backend never ships a half-written segment.
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f
      - -c
      - archive_timeout=300
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pg_wal_archive:/wal-archive
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/unisage-entrypoint.sh:/usr/local/bin/unisage-entrypoint.sh:ro
      # A host folder, so a backend run outside Docker (BACKUP_RESTORE_DIR) can reach it too.
      - ${BACKUP_RESTORE_HOST_DIR:-./.backup-restore}:/restore

  unisage-minio:
    image: cgr.dev/chainguard/minio:latest   # minio/minio was removed from Docker Hub (Sep 2026); pin a digest/tag before deploying past dev
    container_name: unisage-minio
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  backend-java:
    profiles:
      - app
    build: .
    container_name: backend-java
    ports:
      - "${SERVER_PORT:-8401}:${SERVER_PORT:-8401}"
    depends_on:
      - unisage-db
      - unisage-minio
    env_file:
      - .ENV
    environment:
      - DB_HOST=unisage-db
      - DB_PORT=5432
      - MINIO_ENDPOINT=http://unisage-minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9100
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - BACKUP_WAL_ARCHIVE_DIR=/wal-archive
      - BACKUP_RESTORE_DIR=/restore
      - QDRANT_URL=${QDRANT_URL:-http://host.docker.internal:6333}
    volumes:
      - pg_wal_archive:/wal-archive
      - ${BACKUP_RESTORE_HOST_DIR:-./.backup-restore}:/restore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  devcontainer:
    profiles:
      - devcontainer
    image: mcr.microsoft.com/devcontainers/java:1-17-bullseye
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    depends_on:
      - unisage-db
      - unisage-minio
    environment:
      - DB_HOST=unisage-db
      - DB_PORT=5432
      - DB_NAME=assistant_DB
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - SERVER_PORT=8401
      - SPRING_APPLICATION_NAME=Unisage_Assistant
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - JWT_ACCESS_TOKEN_EXPIRATION=86400000
      - JWT_REFRESH_TOKEN_EXPIRATION=2592000000
      - JWT_SECRET=Unisage_Enterprise_Assistant_Authentication_Secret_Key
      - DEFAULT_SUPERADMIN_PASS=123123
      - DEFAULT_INGESTADMIN_PASS=123123
      - DEFAULT_USER_PASS=123123
      - MINIO_ENDPOINT=http://unisage-minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9100
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_BUCKET=unisage-documents
      - REDIS_URL=redis://host.docker.internal:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  minio_data:
  pg_wal_archive:
