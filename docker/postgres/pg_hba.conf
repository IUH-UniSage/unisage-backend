# UNISAGE-102: the image's default pg_hba.conf, plus password replication connections from other
# containers so backend-java can run pg_basebackup (ADR-0008). Passed to the server with
# -c hba_file=..., which, unlike an init script, also applies to an existing data volume.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
