services:
  unisage-db:
    image: pgvector/pgvector:pg17
    container_name: unisage-postgres
    environment:
      POSTGRES_DB: assistant_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unisage-prod

  unisage-minio:
    image: minio/minio:latest
    container_name: unisage-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - unisage-prod

  backend-java:
    build: .
    container_name: backend-java
    expose:
      - "${SERVER_PORT:-8401}"
    depends_on:
      - unisage-db
      - unisage-minio
    env_file:
      - .ENV
    environment:
      - DB_HOST=unisage-db
      - DB_PORT=5432
      - MINIO_ENDPOINT=http://unisage-minio:9000
    networks:
      - unisage-prod

# Shared with api-gateway's and unisage-agent's docker-compose.prod.yml — create once with
# `docker network create unisage-prod` before starting any of the 3 stacks.
networks:
  unisage-prod:
    external: true

volumes:
  postgres_data:
  minio_data:
